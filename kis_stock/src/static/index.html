        // 뉴스 탭 자동 로드 (보유종목 뉴스 자동 표시)
        async function loadNewsTabWithAutoNews() {
            const holdingsContainer = document.getElementById('news-holdings-content');
            const newsContainer = document.getElementById('news-search-result');
            const isOverseas = currentNewsMarket === 'overseas';

            // 보유종목 로드
            let balance = isOverseas ? cachedOverseasBalance : cachedDomesticBalance;

            if (!balance) {
                holdingsContainer.innerHTML = '<div class="loading">로딩 중</div>';
                newsContainer.innerHTML = '<div class="loading">뉴스 로딩 중</div>';

                try {
                    const endpoint = isOverseas ? 'get_overseas_balance' : 'get_domestic_balance';
                    const res = await fetch('/call', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: endpoint, arguments: {} })
                    });

                    const data = await res.json();

                    if (data.error) {
                        holdingsContainer.innerHTML = `<div class="error">${data.error}</div>`;
                        newsContainer.innerHTML = '';
                        return;
                    }

                    if (isOverseas) {
                        cachedOverseasBalance = data;
                    } else {
                        cachedDomesticBalance = data;
                    }
                    balance = data;
                } catch (e) {
                    holdingsContainer.innerHTML = `<div class="error">조회 실패: ${e.message}</div>`;
                    newsContainer.innerHTML = '';
                    return;
                }
            }

            const holdings = balance.holdings || [];
            if (holdings.length === 0) {
                holdingsContainer.innerHTML = '<div style="text-align: center; padding: 20px; color: var(--text-secondary);">보유 종목 없음</div>';
                newsContainer.innerHTML = '<div style="text-align: center; padding: 20px; color: var(--text-secondary);">보유 종목이 없습니다</div>';
                return;
            }

            // 시세 조회 중 표시
            holdingsContainer.innerHTML = '<div class="loading">시세 조회 중</div>';

            // 각 종목의 시세를 병렬로 조회
            const pricePromises = holdings.map(stock => {
                const code = isOverseas ? stock.symbol : stock.stock_code;
                return fetch('/call', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: 'get_stock_price',
                        arguments: {
                            stock_code: code,
                            market: isOverseas ? 'overseas' : 'domestic'
                        }
                    })
                }).then(res => res.json()).catch(() => null);
            });

            const priceResults = await Promise.all(pricePromises);

            // 시세 데이터와 잔고 데이터 합치기
            const holdingsWithPrice = holdings.map((stock, i) => ({
                ...stock,
                priceData: priceResults[i]
            }));

            renderNewsHoldings({ holdings: holdingsWithPrice }, holdingsContainer, currentNewsMarket);

            // 보유종목이 있으면 자동으로 뉴스 로드
            if (balance.holdings && balance.holdings.length > 0) {
                newsContainer.innerHTML = '<div class="loading">보유종목 뉴스 검색 중</div>';

                // 최대 3개 종목의 뉴스를 병렬로 가져옴
                const stocksToFetch = balance.holdings.slice(0, 3);
                const newsPromises = stocksToFetch.map(h =>
                    fetch('/call', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            name: 'get_stock_news',
                            arguments: { stock_name: h.stock_name, count: 5 }
                        })
                    }).then(res => res.json()).then(data => ({
                        stockName: h.stock_name,
                        news: data.news || []
                    })).catch(() => ({ stockName: h.stock_name, news: [] }))
                );

                const results = await Promise.all(newsPromises);

                // 모든 뉴스를 합쳐서 날짜순 정렬
                let allNews = [];
                results.forEach(r => {
                    r.news.forEach(n => {
                        allNews.push({ ...n, stockName: r.stockName });
                    });
                });

                // 날짜순 정렬 (최신순)
                allNews.sort((a, b) => {
                    const dateA = new Date(a.pub_date);
                    const dateB = new Date(b.pub_date);
                    return dateB - dateA;
                });

                // 최대 8개만 표시
                allNews = allNews.slice(0, 8);

                renderCombinedNews(allNews, newsContainer);
                updateTimestamp();
            } else {
                newsContainer.innerHTML = '<div style="text-align: center; padding: 20px; color: var(--text-secondary);">보유 종목이 없습니다</div>';
            }
        }

        // 여러 종목 뉴스 통합 렌더링
        function renderCombinedNews(news, container) {
            if (!news || news.length === 0) {
                container.innerHTML = '<div style="text-align: center; padding: 20px; color: var(--text-secondary);">뉴스 없음 (네이버 API 키 설정 필요)</div>';
                return;
            }

            let html = '<div class="stock-list">';
            news.forEach(n => {
                html += `
                    <div class="stock-item" onclick="window.open('${n.link}', '_blank')" style="min-height: auto;">
                        <div class="stock-info" style="flex: 1;">
                            <h3 style="font-size: 13px; line-height: 1.4; margin-bottom: 4px;">${n.title}</h3>
                            <div class="code" style="font-size: 11px; color: var(--text-secondary);">${n.stockName} · ${n.pub_date}</div>
                        </div>
                        <div style="color: var(--text-secondary); font-size: 20px;">→</div>
                    </div>
                `;
            });
            html += '</div>';
            container.innerHTML = html;
        }

        // 뉴스 탭 - 보유종목 로드
        async function loadNewsHoldings() {
            const container = document.getElementById('news-holdings-content');
            const isOverseas = currentNewsMarket === 'overseas';

            // 캐시된 시세 데이터가 있으면 재사용
            if (cachedNewsHoldings && cachedNewsHoldings.market === currentNewsMarket) {
                renderNewsHoldings({ holdings: cachedNewsHoldings.holdings }, container, currentNewsMarket);
                return;
            }

            const balance = isOverseas ? cachedOverseasBalance : cachedDomesticBalance;

            if (!balance) {
                container.innerHTML = '<div class="loading">로딩 중</div>';

                try {
                    const endpoint = isOverseas ? 'get_overseas_balance' : 'get_domestic_balance';
                    const res = await fetch('/call', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: endpoint, arguments: {} })
                    });

                    const data = await res.json();

                    if (data.error) {
                        container.innerHTML = `<div class="error">${data.error}</div>`;
                        return;
                    }

                    if (isOverseas) {
                        cachedOverseasBalance = data;
                    } else {
                        cachedDomesticBalance = data;
                    }
                } catch (e) {
                    container.innerHTML = `<div class="error">조회 실패: ${e.message}</div>`;
                    return;
                }
            }

            const currentBalance = isOverseas ? cachedOverseasBalance : cachedDomesticBalance;
            const holdings = currentBalance.holdings || [];

            if (holdings.length === 0) {
                container.innerHTML = '<div style="text-align: center; padding: 20px; color: var(--text-secondary);">보유 종목 없음</div>';
                return;
            }

            // 시세 조회 중 표시
            container.innerHTML = '<div class="loading">시세 조회 중</div>';

            // 각 종목의 시세를 병렬로 조회
            const pricePromises = holdings.map(stock => {
                const code = isOverseas ? stock.symbol : stock.stock_code;
                return fetch('/call', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: 'get_stock_price',
                        arguments: {
                            stock_code: code,
                            market: isOverseas ? 'overseas' : 'domestic'
                        }
                    })
                }).then(res => res.json()).catch(() => null);
            });

            const priceResults = await Promise.all(pricePromises);

            // 시세 데이터와 잔고 데이터 합치기
            const holdingsWithPrice = holdings.map((stock, i) => ({
                ...stock,
                priceData: priceResults[i]
            }));

            renderNewsHoldings({ holdings: holdingsWithPrice }, container, currentNewsMarket);
        }

        function renderNewsHoldings(data, container, market) {
            if (!data.holdings || data.holdings.length === 0) {
                container.innerHTML = '<div style="text-align: center; padding: 20px; color: var(--text-secondary);">보유 종목 없음</div>';
                return;
            }

            const isOverseas = market === 'overseas';

            // 캐시 저장
            cachedNewsHoldings = { holdings: data.holdings, market };

            // 정렬 토글 추가
            let html = createSortToggle('news');
            html += '<div class="stock-list">';

            // 금일 변동률 기준 정렬
            const getChangeRate = (stock) => {
                if (stock.priceData && !stock.priceData.error) {
                    return stock.priceData.change_rate || 0;
                }
                return 0;
            };
            const sorted = sortHoldings(data.holdings, currentSortOrder, getChangeRate);

            sorted.forEach(stock => {
                const stockName = stock.stock_name;
                const stockCode = isOverseas ? stock.symbol : stock.stock_code;
                const priceData = stock.priceData;

                // 금일 변동 정보 (시세 데이터가 있으면 사용)
                let changeRate = 0;
                let changeAmount = 0;
                let currentPrice = stock.current_price;

                if (priceData && !priceData.error) {
                    changeRate = priceData.change_rate || 0;
                    changeAmount = priceData.change_amount || 0;
                    currentPrice = priceData.current_price || stock.current_price;
                }

                const changeClass = getChangeClass(changeRate);

                // 가격/변동 포맷
                let priceStr, changeStr;
                if (isOverseas) {
                    priceStr = formatCurrency(currentPrice / 100, 'USD');
                    changeStr = formatCurrency(changeAmount / 100, 'USD');
                } else {
                    priceStr = formatCurrency(currentPrice);
                    changeStr = formatCurrency(changeAmount);
                }

                html += `
                    <div class="stock-item" onclick="quickSearchNews('${stockName}')">
                        <div class="stock-info">
                            <h3>${stockName}</h3>
                            <div class="code">${stockCode}${isOverseas ? ' · ' + (stock.exchange || '') : ''}</div>
                        </div>
                        <div class="stock-price">
                            <div class="current">${priceStr}</div>
                            <div class="change ${changeClass}">${changeStr} (${formatPercent(changeRate)})</div>
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            container.innerHTML = html;

            // 정렬 이벤트 바인딩
            bindSortToggle('news', () => {
                if (cachedNewsHoldings) {
                    renderNewsHoldings({ holdings: cachedNewsHoldings.holdings }, container, cachedNewsHoldings.market);
                }
            });
        }

        async function searchNews() {
            const name = document.getElementById('news-name').value.trim();
            if (!name) return;
            await searchNewsWithName(name);
        }

        async function quickSearchNews(stockName) {
            document.getElementById('news-name').value = stockName;
            window.scrollTo({ top: 0, behavior: 'smooth' });
            await searchNewsWithName(stockName);
        }

        async function searchNewsWithName(stockName) {
            const container = document.getElementById('news-search-result');
            container.innerHTML = '<div class="loading">뉴스 검색 중</div>';

            try {
                const res = await fetch('/call', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: 'get_stock_news',
                        arguments: { stock_name: stockName, count: 15 }
                    })
                });

                const data = await res.json();

                if (data.error && !data.news) {
                    container.innerHTML = `<div class="error">${data.error}</div>`;
                    return;
                }

                renderNews(data.news || [], container, stockName);
                updateTimestamp();
            } catch (e) {
                container.innerHTML = `<div class="error">뉴스 검색 실패: ${e.message}</div>`;
            }
        }

        function renderNews(news, container, stockName = '') {
            if (!news || news.length === 0) {
                container.innerHTML = `<div style="text-align: center; padding: 20px; color: var(--text-secondary);">${stockName ? stockName + ' 관련 ' : ''}뉴스 없음 (네이버 API 키 설정 필요)</div>`;
                return;
            }

            let html = '<div class="stock-list">';
            news.forEach(n => {
                html += `
                    <div class="stock-item" onclick="window.open('${n.link}', '_blank')" style="min-height: auto;">
                        <div class="stock-info" style="flex: 1;">
                            <h3 style="font-size: 13px; line-height: 1.4; margin-bottom: 4px;">${n.title}</h3>
                            <div class="code" style="font-size: 11px; color: var(--text-secondary);">${n.pub_date}</div>
                        </div>
                        <div style="color: var(--text-secondary); font-size: 20px;">→</div>
                    </div>
                `;
            });
            html += '</div>';
            container.innerHTML = html;
        }

        function goToNews() {
            closeActionSheet();

            // 탭 전환
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelector('.tab[data-tab="news"]').classList.add('active');
            document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
            document.getElementById('news-tab').classList.remove('hidden');
            currentTab = 'news';
            loadNewsHoldings();

            // 검색 실행
            quickSearchNews(selectedStock.name);
        }

        function updateTimestamp() {
            const now = new Date();
            document.getElementById('lastUpdate').textContent =
                `업데이트: ${now.toLocaleTimeString('ko-KR')}`;
        }

        function refresh() {
            // 캐시 초기화
            cachedDomesticBalance = null;
            cachedOverseasBalance = null;

            if (currentTab === 'balance') loadBalance();
            else if (currentTab === 'price') {
                loadPriceHoldings();
                if (document.getElementById('stock-code').value) searchStock();
            }
            else if (currentTab === 'investor') {
                loadInvestorHoldings();
                if (document.getElementById('investor-code').value) searchInvestor();
            }
            else if (currentTab === 'technical') {
                loadTechnicalHoldings();
                if (document.getElementById('technical-code').value) searchTechnical();
            }
            else if (currentTab === 'financial') {
                loadFinancialHoldings();
                if (document.getElementById('financial-name').value) searchFinancial();
            }
            else if (currentTab === 'news') {
                loadNewsTabWithAutoNews();
            }
        }

        // Enter 키 지원
        document.getElementById('stock-code').addEventListener('keypress', e => {
            if (e.key === 'Enter') searchStock();
        });
        document.getElementById('investor-code').addEventListener('keypress', e => {
            if (e.key === 'Enter') searchInvestor();
        });
        document.getElementById('technical-code').addEventListener('keypress', e => {
            if (e.key === 'Enter') searchTechnical();
        });
        document.getElementById('financial-name').addEventListener('keypress', e => {
            if (e.key === 'Enter') searchFinancial();
        });
        document.getElementById('news-name').addEventListener('keypress', e => {
            if (e.key === 'Enter') searchNews();
        });

        // 툴팁 위치 계산 함수
        function positionTooltip(tooltipIcon) {
            const tooltipText = tooltipIcon.querySelector('.tooltip-text');
            if (!tooltipText) return;

            const iconRect = tooltipIcon.getBoundingClientRect();
            const tooltipWidth = tooltipText.offsetWidth;
            const padding = 16;

            // 수평 위치: 화면 중앙에 맞추되 경계 체크
            let left = iconRect.left + iconRect.width / 2 - tooltipWidth / 2;
            if (left < padding) left = padding;
            if (left + tooltipWidth > window.innerWidth - padding) {
                left = window.innerWidth - tooltipWidth - padding;
            }

            // 수직 위치: 아이콘 위에 표시
            let top = iconRect.top - tooltipText.offsetHeight - 10;
            if (top < padding) {
                top = iconRect.bottom + 10; // 위에 공간 없으면 아래에 표시
            }

            tooltipText.style.left = left + 'px';
            tooltipText.style.top = top + 'px';
        }

        // 툴팁 클릭/터치 이벤트 (모바일 지원)
        document.addEventListener('click', (e) => {
            const tooltipIcon = e.target.closest('.tooltip-icon');

            // 모든 활성 툴팁 닫기
            document.querySelectorAll('.tooltip-icon.active').forEach(el => {
                if (el !== tooltipIcon) {
                    el.classList.remove('active');
                }
            });

            // 클릭한 툴팁 토글
            if (tooltipIcon) {
                e.preventDefault();
                e.stopPropagation();

                const isActive = tooltipIcon.classList.contains('active');
                if (isActive) {
                    tooltipIcon.classList.remove('active');
                } else {
                    tooltipIcon.classList.add('active');
                    positionTooltip(tooltipIcon);
                }
            }
        });

        // PC 마우스 hover 이벤트
        document.addEventListener('mouseenter', (e) => {
            const tooltipIcon = e.target.closest('.tooltip-icon');
            if (tooltipIcon && !('ontouchstart' in window)) {
                tooltipIcon.classList.add('active');
                positionTooltip(tooltipIcon);
            }
        }, true);

        document.addEventListener('mouseleave', (e) => {
            const tooltipIcon = e.target.closest('.tooltip-icon');
            if (tooltipIcon && !('ontouchstart' in window)) {
                tooltipIcon.classList.remove('active');
            }
        }, true);

        // 초기 로드
        loadBalance();
    </script>
</body>
</html>
