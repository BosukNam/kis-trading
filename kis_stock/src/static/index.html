<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>KIS Stock</title>
    <style>
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #1a1a1a;
            --bg-card: #242424;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --accent-green: #00d26a;
            --accent-red: #ff4757;
            --accent-blue: #3b82f6;
            --border-color: #333;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding-bottom: 80px;
        }

        .header {
            background: var(--bg-secondary);
            padding: 16px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
        }

        .header .subtitle {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .tabs {
            display: flex;
            background: var(--bg-secondary);
            padding: 8px;
            gap: 8px;
            position: sticky;
            top: 60px;
            z-index: 99;
        }

        .tab {
            flex: 1;
            padding: 12px 8px;
            border: none;
            background: var(--bg-card);
            color: var(--text-secondary);
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab.active {
            background: var(--accent-blue);
            color: white;
        }

        .content {
            padding: 16px;
        }

        .summary-card {
            background: linear-gradient(135deg, #1e3a5f 0%, #0d1b2a 100%);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .summary-card .label {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .summary-card .value {
            font-size: 28px;
            font-weight: 700;
        }

        .summary-card .profit {
            font-size: 16px;
            margin-top: 8px;
        }

        .profit.positive { color: var(--accent-green); }
        .profit.negative { color: var(--accent-red); }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            margin: 20px 0 12px 0;
            padding-left: 4px;
        }

        .stock-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .stock-item {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: background 0.2s;
        }

        .stock-item:active {
            background: #2a2a2a;
        }

        .stock-info h3 {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .stock-info .code {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .stock-info .quantity {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .stock-price {
            text-align: right;
        }

        .stock-price .current {
            font-size: 15px;
            font-weight: 600;
        }

        .stock-price .change {
            font-size: 13px;
            margin-top: 4px;
        }

        .search-box {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 16px;
            display: flex;
            gap: 8px;
        }

        .search-box input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 16px;
            outline: none;
        }

        .search-box input::placeholder {
            color: var(--text-secondary);
        }

        .search-box button {
            background: var(--accent-blue);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }

        .price-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .price-card .name {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .price-card .code {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 16px;
        }

        .price-card .current-price {
            font-size: 32px;
            font-weight: 700;
        }

        .price-card .change-info {
            font-size: 16px;
            margin-top: 8px;
        }

        .price-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
        }

        .detail-item {
            display: flex;
            justify-content: space-between;
        }

        .detail-item .label {
            color: var(--text-secondary);
            font-size: 13px;
        }

        .detail-item .value {
            font-size: 13px;
            font-weight: 500;
        }

        .investor-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .investor-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .investor-row:last-child {
            border-bottom: none;
        }

        .investor-row .name {
            font-size: 15px;
        }

        .investor-row .amount {
            font-size: 15px;
            font-weight: 600;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        .loading::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid var(--text-secondary);
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            background: rgba(255, 71, 87, 0.1);
            border: 1px solid var(--accent-red);
            border-radius: 12px;
            padding: 16px;
            color: var(--accent-red);
            text-align: center;
        }

        .refresh-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--accent-blue);
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }

        .market-toggle {
            display: flex;
            background: var(--bg-card);
            border-radius: 8px;
            padding: 4px;
            margin-bottom: 16px;
        }

        .market-toggle button {
            flex: 1;
            padding: 8px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
        }

        .market-toggle button.active {
            background: var(--accent-blue);
            color: white;
        }

        /* Action Sheet 스타일 */
        .action-sheet-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 200;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .action-sheet-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .action-sheet {
            background: var(--bg-secondary);
            border-radius: 16px 16px 0 0;
            width: 100%;
            max-width: 500px;
            padding: 16px 16px 32px 16px;
            transform: translateY(100%);
            transition: transform 0.3s;
        }

        .action-sheet-overlay.show .action-sheet {
            transform: translateY(0);
        }

        .action-sheet-header {
            text-align: center;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 8px;
        }

        .action-sheet-header h3 {
            font-size: 16px;
            font-weight: 600;
        }

        .action-sheet-header .code {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .action-sheet-btn {
            width: 100%;
            padding: 16px;
            border: none;
            background: var(--bg-card);
            color: var(--text-primary);
            font-size: 16px;
            text-align: center;
            cursor: pointer;
            border-radius: 12px;
            margin-top: 8px;
        }

        .action-sheet-btn:active {
            background: #2a2a2a;
        }

        .action-sheet-btn.cancel {
            color: var(--accent-red);
            margin-top: 16px;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="header">
        <h1>KIS Stock</h1>
        <div class="subtitle" id="lastUpdate">업데이트: --</div>
    </div>

    <div class="tabs">
        <button class="tab active" data-tab="balance">잔고</button>
        <button class="tab" data-tab="price">시세</button>
        <button class="tab" data-tab="investor">수급</button>
        <button class="tab" data-tab="technical">지표</button>
        <button class="tab" data-tab="financial">재무</button>
    </div>

    <div class="content">
        <!-- 잔고 탭 -->
        <div id="balance-tab" class="tab-content">
            <div class="market-toggle" id="balance-market-toggle">
                <button class="active" data-market="domestic">국내</button>
                <button data-market="overseas">해외</button>
            </div>

            <div id="balance-content">
                <div class="loading">로딩 중</div>
            </div>
        </div>

        <!-- 시세 탭 -->
        <div id="price-tab" class="tab-content hidden">
            <div class="search-box">
                <input type="text" id="stock-code" placeholder="종목코드 또는 종목명 (예: 005930, 삼성전자)">
                <button onclick="searchStock()">조회</button>
            </div>
            <div id="price-search-result"></div>

            <div class="market-toggle" id="price-market-toggle">
                <button class="active" data-market="domestic">국내</button>
                <button data-market="overseas">해외</button>
            </div>
            <div id="price-holdings-content">
                <div class="loading">로딩 중</div>
            </div>
        </div>

        <!-- 수급 탭 -->
        <div id="investor-tab" class="tab-content hidden">
            <div class="search-box">
                <input type="text" id="investor-code" placeholder="종목코드 또는 종목명 (예: 005930, 삼성전자)">
                <button onclick="searchInvestor()">조회</button>
            </div>
            <div id="investor-search-result"></div>

            <div class="section-title">내 보유종목 (국내)</div>
            <div id="investor-holdings-content">
                <div class="loading">로딩 중</div>
            </div>
        </div>

        <!-- 기술지표 탭 -->
        <div id="technical-tab" class="tab-content hidden">
            <div class="search-box">
                <input type="text" id="technical-code" placeholder="종목코드 또는 종목명 (예: 005930, 삼성전자)">
                <button onclick="searchTechnical()">조회</button>
            </div>
            <div id="technical-search-result"></div>

            <div class="section-title">내 보유종목 (국내)</div>
            <div id="technical-holdings-content">
                <div class="loading">로딩 중</div>
            </div>
        </div>

        <!-- 재무/공시 탭 -->
        <div id="financial-tab" class="tab-content hidden">
            <div class="search-box">
                <input type="text" id="financial-name" placeholder="종목명 (예: 삼성전자)">
                <button onclick="searchFinancial()">조회</button>
            </div>
            <div id="financial-search-result"></div>

            <div class="section-title">최근 공시</div>
            <div id="disclosure-content"></div>

            <div class="section-title">내 보유종목 (국내)</div>
            <div id="financial-holdings-content">
                <div class="loading">로딩 중</div>
            </div>
        </div>
    </div>

    <!-- Action Sheet -->
    <div class="action-sheet-overlay" id="actionSheet" onclick="closeActionSheet(event)">
        <div class="action-sheet" onclick="event.stopPropagation()">
            <div class="action-sheet-header">
                <h3 id="actionStockName">종목명</h3>
                <div class="code" id="actionStockCode">종목코드</div>
            </div>
            <button class="action-sheet-btn" onclick="goToPrice()">📈 시세 조회</button>
            <button class="action-sheet-btn" id="actionInvestorBtn" onclick="goToInvestor()">📊 수급 조회</button>
            <button class="action-sheet-btn" id="actionTechnicalBtn" onclick="goToTechnical()">📉 기술지표</button>
            <button class="action-sheet-btn cancel" onclick="closeActionSheet()">취소</button>
        </div>
    </div>

    <button class="refresh-btn" onclick="refresh()">↻</button>

    <script>
        const API_BASE = '';
        let currentTab = 'balance';
        let currentBalanceMarket = 'domestic';
        let currentPriceMarket = 'domestic';
        let selectedStock = null;

        // 캐시된 잔고 데이터
        let cachedDomesticBalance = null;
        let cachedOverseasBalance = null;

        // 숫자 포맷
        function formatNumber(num) {
            return new Intl.NumberFormat('ko-KR').format(num);
        }

        function formatCurrency(num, currency = 'KRW') {
            if (currency === 'USD') {
                return '$' + formatNumber(num.toFixed(2));
            }
            return formatNumber(num) + '원';
        }

        function formatPercent(num) {
            const sign = num >= 0 ? '+' : '';
            return sign + num.toFixed(2) + '%';
        }

        function getChangeClass(value) {
            return value >= 0 ? 'positive' : 'negative';
        }

        // 탭 전환
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');

                currentTab = tab.dataset.tab;
                document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
                document.getElementById(currentTab + '-tab').classList.remove('hidden');

                if (currentTab === 'balance') {
                    loadBalance();
                } else if (currentTab === 'price') {
                    loadPriceHoldings();
                } else if (currentTab === 'investor') {
                    loadInvestorHoldings();
                } else if (currentTab === 'technical') {
                    loadTechnicalHoldings();
                } else if (currentTab === 'financial') {
                    loadFinancialHoldings();
                }
            });
        });

        // 잔고 마켓 토글
        document.querySelectorAll('#balance-market-toggle button').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#balance-market-toggle button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentBalanceMarket = btn.dataset.market;
                loadBalance();
            });
        });

        // 시세 마켓 토글
        document.querySelectorAll('#price-market-toggle button').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#price-market-toggle button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentPriceMarket = btn.dataset.market;
                loadPriceHoldings();
            });
        });

        // 잔고 조회
        async function loadBalance() {
            const container = document.getElementById('balance-content');
            container.innerHTML = '<div class="loading">로딩 중</div>';

            try {
                const endpoint = currentBalanceMarket === 'domestic' ? 'get_domestic_balance' : 'get_overseas_balance';
                const res = await fetch('/call', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: endpoint, arguments: {} })
                });

                const data = await res.json();

                if (data.error) {
                    container.innerHTML = `<div class="error">${data.error}</div>`;
                    return;
                }

                // 캐시 저장
                if (currentBalanceMarket === 'domestic') {
                    cachedDomesticBalance = data;
                } else {
                    cachedOverseasBalance = data;
                }

                if (currentBalanceMarket === 'domestic') {
                    renderDomesticBalance(data, container, true);
                } else {
                    renderOverseasBalance(data, container, true);
                }

                updateTimestamp();
            } catch (e) {
                container.innerHTML = `<div class="error">조회 실패: ${e.message}</div>`;
            }
        }

        function renderDomesticBalance(data, container, showSummary = true) {
            let html = '';

            if (showSummary) {
                const profitClass = getChangeClass(data.profit_loss);
                html += `
                    <div class="summary-card">
                        <div class="label">총 자산</div>
                        <div class="value">${formatCurrency(data.total_asset)}</div>
                        <div class="profit ${profitClass}">
                            ${formatCurrency(data.profit_loss)} (${formatPercent(data.profit_rate)})
                        </div>
                    </div>
                `;
            }

            html += '<div class="stock-list">';

            if (data.holdings && data.holdings.length > 0) {
                data.holdings.sort((a, b) => b.eval_amount - a.eval_amount).forEach(stock => {
                    const changeClass = getChangeClass(stock.profit_rate);
                    html += `
                        <div class="stock-item" onclick="showActionSheet('${stock.stock_name}', '${stock.stock_code}', 'domestic')">
                            <div class="stock-info">
                                <h3>${stock.stock_name}</h3>
                                <div class="code">${stock.stock_code}</div>
                                <div class="quantity">${formatNumber(stock.quantity)}주</div>
                            </div>
                            <div class="stock-price">
                                <div class="current">${formatCurrency(stock.eval_amount)}</div>
                                <div class="change ${changeClass}">${formatPercent(stock.profit_rate)}</div>
                            </div>
                        </div>
                    `;
                });
            } else {
                html += '<div style="text-align: center; padding: 20px; color: var(--text-secondary);">보유 종목 없음</div>';
            }

            html += '</div>';
            container.innerHTML = html;
        }

        function renderOverseasBalance(data, container, showSummary = true) {
            let html = '';

            if (showSummary) {
                const profitClass = getChangeClass(data.profit_rate);
                html += `
                    <div class="summary-card">
                        <div class="label">총 자산</div>
                        <div class="value">${formatCurrency(data.total_asset_usd, 'USD')}</div>
                        <div class="profit ${profitClass}">
                            ${formatCurrency(data.profit_loss_usd, 'USD')} (${formatPercent(data.profit_rate)})
                        </div>
                        <div style="font-size: 12px; color: var(--text-secondary); margin-top: 8px;">
                            환율: ${formatNumber(data.exchange_rate)}원/USD
                        </div>
                    </div>
                `;
            }

            html += '<div class="stock-list">';

            if (data.holdings && data.holdings.length > 0) {
                data.holdings.forEach(stock => {
                    const changeClass = getChangeClass(stock.profit_rate);
                    html += `
                        <div class="stock-item" onclick="showActionSheet('${stock.stock_name}', '${stock.symbol}', 'overseas')">
                            <div class="stock-info">
                                <h3>${stock.stock_name}</h3>
                                <div class="code">${stock.symbol} · ${stock.exchange}</div>
                                <div class="quantity">${formatNumber(stock.quantity)}주</div>
                            </div>
                            <div class="stock-price">
                                <div class="current">${formatCurrency(stock.eval_amount, 'USD')}</div>
                                <div class="change ${changeClass}">${formatPercent(stock.profit_rate)}</div>
                            </div>
                        </div>
                    `;
                });
            } else {
                html += '<div style="text-align: center; padding: 20px; color: var(--text-secondary);">보유 종목 없음</div>';
            }

            html += '</div>';
            container.innerHTML = html;
        }

        // 시세 탭 - 보유종목 로드
        async function loadPriceHoldings() {
            const container = document.getElementById('price-holdings-content');

            const cached = currentPriceMarket === 'domestic' ? cachedDomesticBalance : cachedOverseasBalance;

            if (cached) {
                renderPriceHoldings(cached, container);
                return;
            }

            container.innerHTML = '<div class="loading">로딩 중</div>';

            try {
                const endpoint = currentPriceMarket === 'domestic' ? 'get_domestic_balance' : 'get_overseas_balance';
                const res = await fetch('/call', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: endpoint, arguments: {} })
                });

                const data = await res.json();

                if (data.error) {
                    container.innerHTML = `<div class="error">${data.error}</div>`;
                    return;
                }

                // 캐시 저장
                if (currentPriceMarket === 'domestic') {
                    cachedDomesticBalance = data;
                } else {
                    cachedOverseasBalance = data;
                }

                renderPriceHoldings(data, container);
            } catch (e) {
                container.innerHTML = `<div class="error">조회 실패: ${e.message}</div>`;
            }
        }

        function renderPriceHoldings(data, container) {
            const isOverseas = currentPriceMarket === 'overseas';
            let html = '<div class="section-title">내 보유종목</div><div class="stock-list">';

            const holdings = data.holdings || [];
            if (holdings.length > 0) {
                holdings.forEach(stock => {
                    const code = isOverseas ? stock.symbol : stock.stock_code;
                    const name = stock.stock_name;
                    const changeClass = getChangeClass(stock.profit_rate);

                    html += `
                        <div class="stock-item" onclick="quickSearchStock('${code}', ${isOverseas}, '${name}')">
                            <div class="stock-info">
                                <h3>${name}</h3>
                                <div class="code">${code}${isOverseas ? ' · ' + stock.exchange : ''}</div>
                            </div>
                            <div class="stock-price">
                                <div class="current">${isOverseas ? formatCurrency(stock.current_price, 'USD') : formatCurrency(stock.current_price)}</div>
                                <div class="change ${changeClass}">${formatPercent(stock.profit_rate)}</div>
                            </div>
                        </div>
                    `;
                });
            } else {

            `;
        }

        // 재무 탭 - 보유종목 로드
        async function loadFinancialHoldings() {
            const container = document.getElementById('financial-holdings-content');

            if (cachedDomesticBalance) {
                renderFinancialHoldings(cachedDomesticBalance, container);
                return;
            }

            container.innerHTML = '<div class="loading">로딩 중</div>';

            try {
                const res = await fetch('/call', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: 'get_domestic_balance', arguments: {} })
                });

                const data = await res.json();

                if (data.error) {
                    container.innerHTML = `<div class="error">${data.error}</div>`;
                    return;
                }

                cachedDomesticBalance = data;
                renderFinancialHoldings(data, container);
            } catch (e) {
                container.innerHTML = `<div class="error">조회 실패: ${e.message}</div>`;
            }
        }

        function renderFinancialHoldings(data, container) {
            let html = '<div class="stock-list">';

            const holdings = data.holdings || [];
            if (holdings.length > 0) {
                holdings.sort((a, b) => b.eval_amount - a.eval_amount).forEach(stock => {
                    const changeClass = getChangeClass(stock.profit_rate);
                    html += `
                        <div class="stock-item" onclick="quickSearchFinancial('${stock.stock_name}', '${stock.stock_code}')">
                            <div class="stock-info">
                                <h3>${stock.stock_name}</h3>
                                <div class="code">${stock.stock_code}</div>
                            </div>
                            <div class="stock-price">
                                <div class="current">${formatCurrency(stock.eval_amount)}</div>
                                <div class="change ${changeClass}">${formatPercent(stock.profit_rate)}</div>
                            </div>
                        </div>
                    `;
                });
            } else {
                html += '<div style="text-align: center; padding: 20px; color: var(--text-secondary);">보유 종목 없음</div>';
            }

            html += '</div>';
            container.innerHTML = html;
        }

        async function quickSearchFinancial(stockName, stockCode) {
            document.getElementById('financial-name').value = stockName;
            window.scrollTo({ top: 0, behavior: 'smooth' });
            await searchFinancialWithCode(stockName, stockCode);
        }

        // 종목코드를 알고 있을 때 빠른 조회
        async function searchFinancialWithCode(stockName, stockCode) {
            const resultContainer = document.getElementById('financial-search-result');
            const disclosureContainer = document.getElementById('disclosure-content');

            resultContainer.innerHTML = '<div class="loading">재무정보 조회 중</div>';
            disclosureContainer.innerHTML = '<div class="loading">공시 조회 중</div>';

            // 재무비율 조회
            try {
                const res = await fetch('/call', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: 'get_financial_ratio',
                        arguments: { stock_code: stockCode, stock_name: stockName }
                    })
                });

                const data = await res.json();

                if (!data.error) {
                    renderFinancialRatio(data, resultContainer);
                } else {
                    resultContainer.innerHTML = `<div class="error">${data.error}</div>`;
                }
            } catch (e) {
                resultContainer.innerHTML = `<div class="error">재무비율 조회 실패</div>`;
            }

            // 공시 조회 (DART API) - stock_code 전달하여 corp_code로 1년치 조회
            try {
                const res = await fetch('/call', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: 'get_disclosures',
                        arguments: { stock_name: stockName, stock_code: stockCode, count: 10 }
                    })
                });

                const data = await res.json();

                if (data.error) {
                    disclosureContainer.innerHTML = `<div class="error">${data.error}</div>`;
                } else {
                    // corp_code로 조회하면 정확한 회사만 반환되므로 필터링 불필요
                    renderDisclosures(data.disclosures || [], disclosureContainer, stockName);
                }
                updateTimestamp();
            } catch (e) {
                disclosureContainer.innerHTML = `<div class="error">공시 조회 실패: ${e.message}</div>`;
            }
        }

        // 재무/공시 조회 (검색창에서 호출)
        async function searchFinancial() {
            const name = document.getElementById('financial-name').value.trim();
            if (!name) return;

            const resultContainer = document.getElementById('financial-search-result');
            const disclosureContainer = document.getElementById('disclosure-content');

            resultContainer.innerHTML = '<div class="loading">재무정보 조회 중</div>';
            disclosureContainer.innerHTML = '<div class="loading">공시 조회 중</div>';

            // 재무비율 조회 (KIS API - 종목코드 필요하므로 잔고에서 찾기)
            let stockCode = null;
            let stockName = name;
            if (cachedDomesticBalance) {
                const found = cachedDomesticBalance.holdings.find(h =>
                    h.stock_name.includes(name) || name.includes(h.stock_name)
                );
                if (found) {
                    stockCode = found.stock_code;
                    stockName = found.stock_name;
                }
            }

            // 재무비율 조회 (종목코드가 있는 경우)
            if (stockCode) {
                try {
                    const res = await fetch('/call', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            name: 'get_financial_ratio',
                            arguments: { stock_code: stockCode, stock_name: stockName }
                        })
                    });

                    const data = await res.json();

                    if (!data.error) {
                        renderFinancialRatio(data, resultContainer);
                    } else {
                        resultContainer.innerHTML = `<div class="error">${data.error}</div>`;
                    }
                } catch (e) {
                    resultContainer.innerHTML = `<div class="error">재무비율 조회 실패</div>`;
                }
            } else {
                resultContainer.innerHTML = '<div style="text-align: center; padding: 20px; color: var(--text-secondary);">보유 종목에서 찾을 수 없습니다. 공시만 조회합니다.</div>';
            }

            // 공시 조회 (DART API) - stock_code가 있으면 함께 전달
            try {
                const res = await fetch('/call', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: 'get_disclosures',
                        arguments: stockCode
                            ? { stock_name: stockName, stock_code: stockCode, count: 10 }
                            : { stock_name: name, count: 30 }
                    })
                });

                const data = await res.json();

                if (data.error) {
                    disclosureContainer.innerHTML = `<div class="error">${data.error}</div>`;
                } else if (stockCode) {
                    // corp_code로 조회하면 정확한 회사만 반환됨
                    renderDisclosures(data.disclosures || [], disclosureContainer, stockName);
                } else {
                    // 종목코드 없이 검색한 경우 - 검색어가 포함된 공시 표시
                    const filtered = (data.disclosures || []).filter(d =>
                        d.corp_name.includes(name) || name.includes(d.corp_name)
                    ).slice(0, 10);
                    renderDisclosures(filtered, disclosureContainer, name);
                }
                updateTimestamp();
            } catch (e) {
                disclosureContainer.innerHTML = `<div class="error">공시 조회 실패: ${e.message}</div>`;
            }
        }

        function renderFinancialRatio(data, container) {
            const formatValue = (val, suffix = '') => val !== null && val !== undefined ? val.toFixed(2) + suffix : '-';

            container.innerHTML = `
                <div class="price-card">
                    <div class="name">${data.stock_name}</div>
                    <div class="code">${data.stock_code} · ${data.fiscal_year}</div>

                    <div class="section-title" style="margin-top: 16px;">수익성</div>
                    <div class="price-details" style="border-top: none; padding-top: 8px;">
                        <div class="detail-item">
                            <span class="label">ROE</span>
                            <span class="value ${data.roe ? getChangeClass(data.roe) : ''}">${formatValue(data.roe, '%')}</span>
                        </div>
                        <div class="detail-item">
                            <span class="label">EPS</span>
                            <span class="value">${data.eps ? formatNumber(data.eps.toFixed(0)) + '원' : '-'}</span>
                        </div>
                    </div>

                    <div class="section-title" style="margin-top: 16px;">성장성</div>
                    <div class="price-details" style="border-top: none; padding-top: 8px;">
                        <div class="detail-item">
                            <span class="label">매출액증가율</span>
                            <span class="value ${data.revenue_growth ? getChangeClass(data.revenue_growth) : ''}">${formatValue(data.revenue_growth, '%')}</span>
                        </div>
                        <div class="detail-item">
                            <span class="label">영업이익증가율</span>
                            <span class="value ${data.operating_profit_growth ? getChangeClass(data.operating_profit_growth) : ''}">${formatValue(data.operating_profit_growth, '%')}</span>
                        </div>
                    </div>

                    <div class="section-title" style="margin-top: 16px;">밸류에이션</div>
                    <div class="price-details" style="border-top: none; padding-top: 8px;">
                        <div class="detail-item">
                            <span class="label">PER</span>
                            <span class="value">${formatValue(data.per)}</span>
                        </div>
                        <div class="detail-item">
                            <span class="label">PBR</span>
                            <span class="value">${formatValue(data.pbr)}</span>
                        </div>
                        <div class="detail-item">
                            <span class="label">부채비율</span>
                            <span class="value">${formatValue(data.debt_ratio, '%')}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderDisclosures(disclosures, container, stockName = '') {
            if (!disclosures || disclosures.length === 0) {
                container.innerHTML = `<div style="text-align: center; padding: 20px; color: var(--text-secondary);">${stockName ? stockName + '의 ' : ''}최근 1년 공시 없음</div>`;
                return;
            }

            let html = '<div class="stock-list">';
            disclosures.forEach(d => {
                const date = d.rcept_dt ? `${d.rcept_dt.slice(0,4)}.${d.rcept_dt.slice(4,6)}.${d.rcept_dt.slice(6,8)}` : '';
                html += `
                    <div class="stock-item" onclick="window.open('https://dart.fss.or.kr/dsaf001/main.do?rcpNo=${d.rcept_no}', '_blank')">
                        <div class="stock-info">
                            <h3 style="font-size: 13px;">${d.report_name}</h3>
                            <div class="code">${d.corp_name} · ${date}</div>
                        </div>
                        <div style="color: var(--text-secondary); font-size: 20px;">→</div>
                    </div>
                `;
            });
            html += '</div>';
            container.innerHTML = html;
        }

        function updateTimestamp() {
            const now = new Date();
            document.getElementById('lastUpdate').textContent =
                `업데이트: ${now.toLocaleTimeString('ko-KR')}`;
        }

        function refresh() {
            // 캐시 초기화
            cachedDomesticBalance = null;
            cachedOverseasBalance = null;

            if (currentTab === 'balance') loadBalance();
            else if (currentTab === 'price') {
                loadPriceHoldings();
                if (document.getElementById('stock-code').value) searchStock();
            }
            else if (currentTab === 'investor') {
                loadInvestorHoldings();
                if (document.getElementById('investor-code').value) searchInvestor();
            }
            else if (currentTab === 'technical') {
                loadTechnicalHoldings();
                if (document.getElementById('technical-code').value) searchTechnical();
            }
            else if (currentTab === 'financial') {
                loadFinancialHoldings();
                if (document.getElementById('financial-name').value) searchFinancial();
            }
        }

        // Enter 키 지원
        document.getElementById('stock-code').addEventListener('keypress', e => {
            if (e.key === 'Enter') searchStock();
        });
        document.getElementById('investor-code').addEventListener('keypress', e => {
            if (e.key === 'Enter') searchInvestor();
        });
        document.getElementById('technical-code').addEventListener('keypress', e => {
            if (e.key === 'Enter') searchTechnical();
        });
        document.getElementById('financial-name').addEventListener('keypress', e => {
            if (e.key === 'Enter') searchFinancial();
        });

        // 초기 로드
        loadBalance();
    </script>
</body>
</html>
