<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>KIS Stock</title>
    <style>
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #1a1a1a;
            --bg-card: #242424;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --accent-green: #00d26a;
            --accent-red: #ff4757;
            --accent-blue: #3b82f6;
            --border-color: #333;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding-bottom: 80px;
        }

        .header {
            background: var(--bg-secondary);
            padding: 16px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
        }

        .header .subtitle {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .tabs {
            display: flex;
            background: var(--bg-secondary);
            padding: 8px;
            gap: 8px;
            position: sticky;
            top: 60px;
            z-index: 99;
        }

        .tab {
            flex: 1;
            padding: 12px 8px;
            border: none;
            background: var(--bg-card);
            color: var(--text-secondary);
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab.active {
            background: var(--accent-blue);
            color: white;
        }

        .content {
            padding: 16px;
        }

        .summary-card {
            background: linear-gradient(135deg, #1e3a5f 0%, #0d1b2a 100%);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .summary-card .label {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .summary-card .value {
            font-size: 28px;
            font-weight: 700;
        }

        .summary-card .profit {
            font-size: 16px;
            margin-top: 8px;
        }

        .profit.positive, .positive { color: var(--accent-green); }
        .profit.negative, .negative { color: var(--accent-red); }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            margin: 20px 0 12px 0;
            padding-left: 4px;
        }

        .card-section-title {
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
            margin: 20px 0 10px 0;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card-section-title .emoji {
            font-size: 14px;
        }

        .label-with-tooltip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .tooltip-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            color: var(--text-secondary);
            font-size: 10px;
            cursor: help;
            position: relative;
        }

        .tooltip-icon:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .tooltip-icon .tooltip-text {
            display: none;
            position: fixed;
            background: #333;
            color: #fff;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            max-width: calc(100vw - 32px);
            z-index: 1000;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
            line-height: 1.5;
            text-align: center;
        }

        .tooltip-icon.active .tooltip-text {
            display: block;
        }

        .growth-note {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 4px;
            padding-left: 4px;
        }

        .stock-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .stock-item {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: background 0.2s;
        }

        .stock-item:active {
            background: #2a2a2a;
        }

        .stock-info h3 {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .stock-info .code {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .stock-info .quantity {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .stock-price {
            text-align: right;
        }

        .stock-price .current {
            font-size: 15px;
            font-weight: 600;
        }

        .stock-price .change {
            font-size: 13px;
            margin-top: 4px;
        }

        .financial-metrics {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .financial-metrics .metric {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 40px;
        }

        .financial-metrics .metric-label {
            font-size: 10px;
            color: var(--text-secondary);
            margin-bottom: 2px;
        }

        .financial-metrics .metric-value {
            font-size: 13px;
            font-weight: 600;
        }

        .investor-data {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 2px;
            font-size: 12px;
        }

        .investor-data span {
            white-space: nowrap;
        }

        .investor-summary {
            text-align: right;
        }

        .investor-summary .total {
            font-size: 16px;
            font-weight: 600;
        }

        .investor-summary .detail {
            font-size: 11px;
            margin-top: 4px;
            display: flex;
            gap: 6px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }

        .search-box {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 16px;
            display: flex;
            gap: 8px;
        }

        .search-box input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 16px;
            outline: none;
        }

        .search-box input::placeholder {
            color: var(--text-secondary);
        }

        .search-box button {
            background: var(--accent-blue);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }

        .price-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .price-card .name {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .price-card .code {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 16px;
        }

        .price-card .current-price {
            font-size: 32px;
            font-weight: 700;
        }

        .price-card .change-info {
            font-size: 16px;
            margin-top: 8px;
        }

        .price-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
        }

        .detail-item {
            display: flex;
            justify-content: space-between;
        }

        .detail-item .label {
            color: var(--text-secondary);
            font-size: 13px;
        }

        .detail-item .value {
            font-size: 13px;
            font-weight: 500;
        }

        .investor-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .investor-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .investor-row:last-child {
            border-bottom: none;
        }

        .investor-row .name {
            font-size: 15px;
        }

        .investor-row .amount {
            font-size: 15px;
            font-weight: 600;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        .loading::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid var(--text-secondary);
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            background: rgba(255, 71, 87, 0.1);
            border: 1px solid var(--accent-red);
            border-radius: 12px;
            padding: 16px;
            color: var(--accent-red);
            text-align: center;
        }

        .refresh-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--accent-blue);
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }

        .market-toggle {
            display: flex;
            background: var(--bg-card);
            border-radius: 8px;
            padding: 4px;
            margin-bottom: 16px;
        }

        .market-toggle button {
            flex: 1;
            padding: 8px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
        }

        .market-toggle button.active {
            background: var(--accent-blue);
            color: white;
        }

        .sort-btn {
            padding: 6px 12px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-secondary);
            border-radius: 16px;
            font-size: 12px;
            cursor: pointer;
            margin-bottom: 12px;
        }

        .sort-btn:active {
            background: var(--bg-secondary);
        }

        .investor-sort-chips {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .sort-chip {
            padding: 6px 12px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-secondary);
            border-radius: 16px;
            font-size: 12px;
            cursor: pointer;
        }

        .sort-chip.active {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
            color: white;
        }

        .sort-chip:active {
            background: var(--bg-secondary);
        }

        .sort-chip.active:active {
            background: var(--accent-blue);
            opacity: 0.8;
        }

        /* Action Sheet 스타일 */
        .action-sheet-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 200;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .action-sheet-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .action-sheet {
            background: var(--bg-secondary);
            border-radius: 16px 16px 0 0;
            width: 100%;
            max-width: 500px;
            padding: 16px 16px 32px 16px;
            transform: translateY(100%);
            transition: transform 0.3s;
        }

        .action-sheet-overlay.show .action-sheet {
            transform: translateY(0);
        }

        .action-sheet-header {
            text-align: center;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 8px;
        }

        .action-sheet-header h3 {
            font-size: 16px;
            font-weight: 600;
        }

        .action-sheet-header .code {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .action-sheet-btn {
            width: 100%;
            padding: 16px;
            border: none;
            background: var(--bg-card);
            color: var(--text-primary);
            font-size: 16px;
            text-align: center;
            cursor: pointer;
            border-radius: 12px;
            margin-top: 8px;
        }

        .action-sheet-btn:active {
            background: #2a2a2a;
        }

        .action-sheet-btn.cancel {
            color: var(--accent-red);
            margin-top: 16px;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="header">
        <h1>KIS Stock</h1>
        <div class="subtitle" id="lastUpdate">업데이트: --</div>
    </div>

    <div class="tabs">
        <button class="tab active" data-tab="balance">잔고</button>
        <button class="tab" data-tab="price">시세</button>
        <button class="tab" data-tab="investor">수급</button>
        <button class="tab" data-tab="technical">지표</button>
        <button class="tab" data-tab="financial">재무</button>
        <button class="tab" data-tab="news">뉴스</button>
    </div>

    <div class="content">
        <!-- 잔고 탭 -->
        <div id="balance-tab" class="tab-content">
            <div class="market-toggle" id="balance-market-toggle">
                <button class="active" data-market="domestic">국내</button>
                <button data-market="overseas">해외</button>
            </div>

            <div id="balance-content">
                <div class="loading">로딩 중</div>
            </div>
        </div>

        <!-- 시세 탭 -->
        <div id="price-tab" class="tab-content hidden">
            <div class="search-box">
                <input type="text" id="stock-code" placeholder="종목코드 또는 종목명 (예: 005930, 삼성전자)">
                <button onclick="searchStock()">조회</button>
            </div>
            <div id="price-search-result"></div>

            <div class="market-toggle" id="price-market-toggle">
                <button class="active" data-market="domestic">국내</button>
                <button data-market="overseas">해외</button>
            </div>
            <div id="price-holdings-content">
                <div class="loading">로딩 중</div>
            </div>
        </div>

        <!-- 수급 탭 -->
        <div id="investor-tab" class="tab-content hidden">
            <div class="search-box">
                <input type="text" id="investor-code" placeholder="종목코드 또는 종목명 (예: 005930, 삼성전자)">
                <button onclick="searchInvestor()">조회</button>
            </div>
            <div id="investor-search-result"></div>

            <div class="section-title">내 보유종목 (국내)</div>
            <div id="investor-holdings-content">
                <div class="loading">로딩 중</div>
            </div>
        </div>

        <!-- 기술지표 탭 -->
        <div id="technical-tab" class="tab-content hidden">
            <div class="search-box">
                <input type="text" id="technical-code" placeholder="종목코드 또는 종목명 (예: 005930, AAPL)">
                <button onclick="searchTechnical()">조회</button>
            </div>
            <div id="technical-search-result"></div>

            <div class="section-title">내 보유종목</div>
            <div class="market-toggle" id="technical-market-toggle">
                <button class="active" data-market="domestic">국내</button>
                <button data-market="overseas">해외</button>
            </div>
            <div id="technical-holdings-content">
                <div class="loading">로딩 중</div>
            </div>
        </div>

        <!-- 재무/공시 탭 -->
        <div id="financial-tab" class="tab-content hidden">
            <div class="search-box">
                <input type="text" id="financial-name" placeholder="종목명 (예: 삼성전자)">
                <button onclick="searchFinancial()">조회</button>
            </div>
            <div id="financial-search-result"></div>

            <div class="section-title">최근 공시</div>
            <div id="disclosure-content"></div>

            <div class="section-title">내 보유종목 (국내)</div>
            <div id="financial-holdings-content">
                <div class="loading">로딩 중</div>
            </div>
        </div>

        <!-- 뉴스 탭 -->
        <div id="news-tab" class="tab-content hidden">
            <div class="search-box">
                <input type="text" id="news-name" placeholder="종목명 (예: 삼성전자, AAPL)">
                <button onclick="searchNews()">조회</button>
            </div>
            <div id="news-search-result"></div>

            <div class="section-title">내 보유종목</div>
            <div class="market-toggle" id="news-market-toggle">
                <button class="active" data-market="domestic">국내</button>
                <button data-market="overseas">해외</button>
            </div>
            <div id="news-holdings-content">
                <div class="loading">로딩 중</div>
            </div>
        </div>
    </div>

    <!-- Action Sheet -->
    <div class="action-sheet-overlay" id="actionSheet" onclick="closeActionSheet(event)">
        <div class="action-sheet" onclick="event.stopPropagation()">
            <div class="action-sheet-header">
                <h3 id="actionStockName">종목명</h3>
                <div class="code" id="actionStockCode">종목코드</div>
            </div>
            <button class="action-sheet-btn" onclick="goToPrice()">📈 시세 조회</button>
            <button class="action-sheet-btn" id="actionInvestorBtn" onclick="goToInvestor()">📊 수급 조회</button>
            <button class="action-sheet-btn" id="actionTechnicalBtn" onclick="goToTechnical()">📉 기술지표</button>
            <button class="action-sheet-btn" id="actionNewsBtn" onclick="goToNews()">📰 뉴스</button>
            <button class="action-sheet-btn cancel" onclick="closeActionSheet()">취소</button>
        </div>
    </div>

    <button class="refresh-btn" onclick="refresh()">↻</button>

    <script>
        const API_BASE = '';
        let currentTab = 'balance';
        let currentBalanceMarket = 'domestic';
        let currentPriceMarket = 'domestic';
        let selectedStock = null;

        // 캐시된 잔고 데이터
        let cachedDomesticBalance = null;
        let cachedOverseasBalance = null;

        // 캐시된 재무비율 데이터 (종목코드 -> 데이터)
        let cachedFinancialRatios = {};

        // 환율 캐시 (30분간 유효)
        let cachedExchangeRate = null;
        let exchangeRateCacheTime = null;
        const EXCHANGE_RATE_CACHE_DURATION = 30 * 60 * 1000; // 30분

        // 실시간 환율 조회 (USD -> KRW)
        async function getExchangeRate() {
            // 캐시 확인
            if (cachedExchangeRate && exchangeRateCacheTime &&
                (Date.now() - exchangeRateCacheTime) < EXCHANGE_RATE_CACHE_DURATION) {
                return cachedExchangeRate;
            }

            try {
                // 무료 환율 API 사용
                const res = await fetch('https://api.exchangerate-api.com/v4/latest/USD');
                const data = await res.json();
                if (data && data.rates && data.rates.KRW) {
                    cachedExchangeRate = data.rates.KRW;
                    exchangeRateCacheTime = Date.now();
                    return cachedExchangeRate;
                }
            } catch (e) {
                console.warn('환율 조회 실패, 기본값 사용:', e);
            }

            // 실패 시 기본값 반환
            return 1300;
        }

        // 정렬 상태 (default, high, low)
        let currentSortOrder = 'default';

        // 수급탭 정렬 상태 (type: individual, foreign, institution, total / order: default, high, low)
        let investorSortType = 'total';
        let investorSortOrder = 'default';

        // 재무탭 정렬 상태 (type: roe, per, pbr / order: default, high, low)
        let financialSortType = 'roe';
        let financialSortOrder = 'default';

        // 정렬 함수
        function sortHoldings(holdings, sortOrder, getRateFunc) {
            if (sortOrder === 'default') {
                return [...holdings];
            }
            return [...holdings].sort((a, b) => {
                const rateA = getRateFunc(a);
                const rateB = getRateFunc(b);
                return sortOrder === 'high' ? rateB - rateA : rateA - rateB;
            });
        }

        // 정렬 버튼 라벨
        function getSortLabel() {
            if (currentSortOrder === 'high') return '▲ 높은순';
            if (currentSortOrder === 'low') return '▼ 낮은순';
            return '정렬';
        }

        // 정렬 순환: default -> high -> low -> default
        function nextSortOrder() {
            if (currentSortOrder === 'default') return 'high';
            if (currentSortOrder === 'high') return 'low';
            return 'default';
        }

        // 수급탭 정렬 칩 라벨
        function getInvestorSortLabel(type) {
            const labels = { individual: '개인', foreign: '외인', institution: '기관', total: '전체' };
            const label = labels[type] || '전체';
            if (investorSortType !== type) return label;
            if (investorSortOrder === 'high') return '▲ ' + label;
            if (investorSortOrder === 'low') return '▼ ' + label;
            return label;
        }

        // 정렬 버튼 HTML 생성
        function createSortToggle(tabName) {
            return `<button class="sort-btn" id="${tabName}-sort-btn">${getSortLabel()}</button>`;
        }

        // 수급탭 정렬 칩 HTML 생성
        function createInvestorSortToggle() {
            const types = ['individual', 'foreign', 'institution', 'total'];
            let html = '<div class="investor-sort-chips">';
            types.forEach(type => {
                const isActive = investorSortType === type && investorSortOrder !== 'default';
                html += `<button class="sort-chip ${isActive ? 'active' : ''}" data-type="${type}">${getInvestorSortLabel(type)}</button>`;
            });
            html += '</div>';
            return html;
        }

        // 재무탭 정렬 칩 라벨
        function getFinancialSortLabel(type) {
            const labels = { roe: 'ROE', per: 'PER', pbr: 'PBR' };
            const label = labels[type] || 'ROE';
            if (financialSortType !== type) return label;
            if (financialSortOrder === 'high') return '▲ ' + label;
            if (financialSortOrder === 'low') return '▼ ' + label;
            return label;
        }

        // 재무탭 정렬 칩 HTML 생성
        function createFinancialSortToggle() {
            const types = ['roe', 'per', 'pbr'];
            let html = '<div class="investor-sort-chips" id="financial-sort-chips">';
            types.forEach(type => {
                const isActive = financialSortType === type && financialSortOrder !== 'default';
                html += `<button class="sort-chip ${isActive ? 'active' : ''}" data-type="${type}">${getFinancialSortLabel(type)}</button>`;
            });
            html += '</div>';
            return html;
        }

        // 정렬 버튼 이벤트 바인딩
        function bindSortToggle(tabName, reloadFunc) {
            const btn = document.getElementById(`${tabName}-sort-btn`);
            if (btn) {
                btn.addEventListener('click', () => {
                    currentSortOrder = nextSortOrder();
                    reloadFunc();
                });
            }
        }

        // 숫자 포맷
        function formatNumber(num) {
            return new Intl.NumberFormat('ko-KR').format(num);
        }

        function formatCurrency(num, currency = 'KRW') {
            if (currency === 'USD') {
                return '$' + formatNumber(num.toFixed(2));
            }
            return formatNumber(num) + '원';
        }

        function formatPercent(num) {
            const sign = num >= 0 ? '+' : '';
            return sign + num.toFixed(2) + '%';
        }

        function getChangeClass(value) {
            return value >= 0 ? 'positive' : 'negative';
        }

        // 탭 전환
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');

                currentTab = tab.dataset.tab;
                document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
                document.getElementById(currentTab + '-tab').classList.remove('hidden');

                if (currentTab === 'balance') {
                    loadBalance();
                } else if (currentTab === 'price') {
                    loadPriceHoldings();
                } else if (currentTab === 'investor') {
                    loadInvestorHoldings();
                } else if (currentTab === 'technical') {
                    loadTechnicalHoldings();
                } else if (currentTab === 'financial') {
                    loadFinancialHoldings();
                } else if (currentTab === 'news') {
                    loadNewsTabWithAutoNews();
                }
            });
        });

        // 잔고 마켓 토글
        document.querySelectorAll('#balance-market-toggle button').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#balance-market-toggle button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentBalanceMarket = btn.dataset.market;
                loadBalance();
            });
        });

        // 시세 마켓 토글
        document.querySelectorAll('#price-market-toggle button').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#price-market-toggle button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentPriceMarket = btn.dataset.market;
                loadPriceHoldings();
            });
        });

        // 잔고 조회
        async function loadBalance() {
            const container = document.getElementById('balance-content');
            container.innerHTML = '<div class="loading">로딩 중</div>';

            try {
                const endpoint = currentBalanceMarket === 'domestic' ? 'get_domestic_balance' : 'get_overseas_balance';
                const res = await fetch('/call', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: endpoint, arguments: {} })
                });

                const data = await res.json();

                if (data.error) {
                    container.innerHTML = `<div class="error">${data.error}</div>`;
                    return;
                }

                // 해외 잔고인 경우 실시간 환율 적용
                if (currentBalanceMarket === 'overseas') {
                    const realTimeRate = await getExchangeRate();
                    data.exchange_rate = realTimeRate;
                    data.total_asset_krw = Math.round(data.total_asset_usd * realTimeRate);
                }

                // 캐시 저장
                if (currentBalanceMarket === 'domestic') {
                    cachedDomesticBalance = data;
                } else {
                    cachedOverseasBalance = data;
                }

                if (currentBalanceMarket === 'domestic') {
                    renderDomesticBalance(data, container, true);
                } else {
                    renderOverseasBalance(data, container, true);
                }

                updateTimestamp();
            } catch (e) {
                container.innerHTML = `<div class="error">조회 실패: ${e.message}</div>`;
            }
        }

        function renderDomesticBalance(data, container, showSummary = true) {
            let html = '';

            if (showSummary) {
                const profitClass = getChangeClass(data.profit_loss);
                html += `
                    <div class="summary-card">
                        <div class="label">총 자산</div>
                        <div class="value">${formatCurrency(data.total_asset)}</div>
                        <div class="profit ${profitClass}">
                            ${formatCurrency(data.profit_loss)} (${formatPercent(data.profit_rate)})
                        </div>
                    </div>
                `;
            }

            // 정렬 토글 추가
            html += createSortToggle('balance-domestic');

            html += '<div class="stock-list">';

            if (data.holdings && data.holdings.length > 0) {
                // 기본 정렬: 평가금액 높은 순, 그 외: 수익률 기준

                                <div class="change ${changeClass}">${formatPercent(stock.profit_rate)}</div>

                        </div>

                });

            html += '</div>';
            container.innerHTML = html;

            // 정렬 이벤트 바인딩
            bindSortToggle('balance-domestic', () => renderDomesticBalance(data, container, showSummary));

        function renderOverseasBalance(data, container, showSummary = true) {

            if (showSummary) {
                const profitClass = getChangeClass(data.profit_rate);
                html += `
                    <div class="summary-card">

        // 시세 탭 - 보유종목 로드
        async function loadPriceHoldings() {
            const container = document.getElementById('price-holdings-content');
            const isOverseas = currentPriceMarket === 'overseas';

            // 잔고 데이터 가져오기
            let balance = isOverseas ? cachedOverseasBalance : cachedDomesticBalance;

            if (!balance) {
                container.innerHTML = '<div class="loading">로딩 중</div>';

                try {
                    const endpoint = isOverseas ? 'get_overseas_balance' : 'get_domestic_balance';
                    const res = await fetch('/call', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: endpoint, arguments: {} })
                    });

                    const data = await res.json();

                    if (data.error) {
                        container.innerHTML = `<div class="error">${data.error}</div>`;
                        return;
                    }

                    // 캐시 저장
                    if (isOverseas) {
                        cachedOverseasBalance = data;
                    } else {
                        cachedDomesticBalance = data;
                    }
                    balance = data;
                } catch (e) {
                    container.innerHTML = `<div class="error">조회 실패: ${e.message}</div>`;
                    return;
                }
            }

            const holdings = balance.holdings || [];
            if (holdings.length === 0) {
                container.innerHTML = '<div class="section-title">내 보유종목</div><div style="text-align: center; padding: 20px; color: var(--text-secondary);">보유 종목 없음</div>';
                return;
            }

            // 시세 조회 중 표시
            container.innerHTML = '<div class="section-title">내 보유종목</div><div class="loading">시세 조회 중</div>';

            // 각 종목의 시세를 병렬로 조회
            const pricePromises = holdings.map(stock => {
                const code = isOverseas ? stock.symbol : stock.stock_code;
                return fetch('/call', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: 'get_stock_price',
                        arguments: {
                            stock_code: code,
                            market: isOverseas ? 'overseas' : 'domestic'
                        }
                    })
                }).then(res => res.json()).catch(() => null);
            });

            const priceResults = await Promise.all(pricePromises);

            // 시세 데이터와 잔고 데이터 합치기
            const holdingsWithPrice = holdings.map((stock, i) => ({
                ...stock,
                priceData: priceResults[i]
            }));

            renderPriceHoldings(holdingsWithPrice, container, isOverseas);
        }

        // 캐시된 시세 데이터 (정렬 시 재사용)
        let cachedPriceHoldings = null;

        function renderPriceHoldings(holdings, container, isOverseas) {
            // 캐시 저장
            cachedPriceHoldings = { holdings, isOverseas };

            let html = '<div class="section-title">내 보유종목</div>';

            // 정렬 토글 추가
            html += createSortToggle('price');

            html += '<div class="stock-list">';

            if (holdings.length > 0) {
                // 금일 변동률 기준 정렬
                const getChangeRate = (stock) => {
                    if (stock.priceData && !stock.priceData.error) {
                        return stock.priceData.change_rate || 0;
                    }
                    return 0;
                };
                const sorted = sortHoldings(holdings, currentSortOrder, getChangeRate);

                sorted.forEach(stock => {
                    const code = isOverseas ? stock.symbol : stock.stock_code;
                    const name = stock.stock_name;
                    const priceData = stock.priceData;

                    // 금일 변동 정보 (시세 데이터가 있으면 사용)
                    let changeRate = 0;
                    let changeAmount = 0;
                    let currentPrice = stock.current_price;

                    if (priceData && !priceData.error) {
                        changeRate = priceData.change_rate || 0;
                        changeAmount = priceData.change_amount || 0;
                        currentPrice = priceData.current_price || stock.current_price;
                    }

                    const changeClass = getChangeClass(changeRate);

                    // 가격/변동 포맷
                    let priceStr, changeStr;
                    if (isOverseas) {
                        priceStr = formatCurrency(currentPrice / 100, 'USD');
                        changeStr = formatCurrency(changeAmount / 100, 'USD');
                    } else {
                        priceStr = formatCurrency(currentPrice);
                        changeStr = formatCurrency(changeAmount);
                    }

                    html += `
                        <div class="stock-item" onclick="quickSearchStock('${code}', ${isOverseas}, '${name}')">
                            <div class="stock-info">
                                <h3>${name}</h3>
                                <div class="code">${code}${isOverseas ? ' · ' + stock.exchange : ''}</div>
                            </div>
                            <div class="stock-price">
                                <div class="current">${priceStr}</div>
                                <div class="change ${changeClass}">${changeStr} (${formatPercent(changeRate)})</div>
                            </div>
                        </div>
                    `;
                });
            } else {
                html += '<div style="text-align: center; padding: 20px; color: var(--text-secondary);">보유 종목 없음</div>';
            }

            html += '</div>';
            container.innerHTML = html;

            // 정렬 이벤트 바인딩
            bindSortToggle('price', () => {
                if (cachedPriceHoldings) {
                    renderPriceHoldings(cachedPriceHoldings.holdings, container, cachedPriceHoldings.isOverseas);
                }
            });
        }

        // 수급 탭 - 보유종목 로드
        let cachedInvestorHoldings = null;

        async function loadInvestorHoldings() {
            const container = document.getElementById('investor-holdings-content');

            // 잔고 데이터 가져오기
            let balance = cachedDomesticBalance;

            if (!balance) {
                container.innerHTML = '<div class="loading">로딩 중</div>';

                try {
                    const res = await fetch('/call', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: 'get_domestic_balance', arguments: {} })
                    });

                    const data = await res.json();

                    if (data.error) {
                        container.innerHTML = `<div class="error">${data.error}</div>`;
                        return;
                    }

                    cachedDomesticBalance = data;
                    balance = data;
                } catch (e) {
                    container.innerHTML = `<div class="error">조회 실패: ${e.message}</div>`;
                    return;
                }
            }

            const holdings = balance.holdings || [];
            if (holdings.length === 0) {
                container.innerHTML = '<div style="text-align: center; padding: 20px; color: var(--text-secondary);">보유 종목 없음</div>';
                return;
            }

            // 수급 조회 중 표시
            container.innerHTML = '<div class="loading">수급 조회 중</div>';

            // 각 종목의 투자자 동향을 병렬로 조회
            const investorPromises = holdings.map(stock =>
                fetch('/call', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: 'get_investor_trend',
                        arguments: { stock_code: stock.stock_code }
                    })
                }).then(res => res.json()).catch(() => null)
            );

            const investorResults = await Promise.all(investorPromises);

            // 투자자 동향 데이터와 잔고 데이터 합치기
            const holdingsWithInvestor = holdings.map((stock, i) => ({
                ...stock,
                investorData: investorResults[i]
            }));

            cachedInvestorHoldings = holdingsWithInvestor;
            renderInvestorHoldings(holdingsWithInvestor, container);
        }

        function renderInvestorHoldings(holdings, container) {
            // 투자자 데이터 추출 (당일 0이면 전일 사용)
            const getInvestorData = (inv) => {
                if (!inv || inv.error) return { individual: 0, foreign: 0, institution: 0, total: 0, isPrev: false };

                const today = {
                    individual: inv.individual || 0,
                    foreign: inv.foreign || 0,
                    institution: inv.institution || 0
                };
                today.total = today.individual + today.foreign + today.institution;

                // 당일 데이터가 모두 0이면 전일 데이터 사용
                if (today.individual === 0 && today.foreign === 0 && today.institution === 0) {
                    if (inv.prev_individual != null || inv.prev_foreign != null || inv.prev_institution != null) {
                        const prev = {
                            individual: inv.prev_individual || 0,
                            foreign: inv.prev_foreign || 0,
                            institution: inv.prev_institution || 0,
                            isPrev: true
                        };
                        prev.total = prev.individual + prev.foreign + prev.institution;
                        return prev;
                    }
                }
                return { ...today, isPrev: false };
            };

            // 정렬 칩 추가
            let html = createInvestorSortToggle();
            html += '<div class="stock-list">';

            if (holdings.length > 0) {
                // 선택된 타입에 따른 정렬
                const getSortValue = (h) => {
                    const data = getInvestorData(h.investorData);
                    return data[investorSortType] || 0;
                };
                const sorted = sortHoldings(holdings, investorSortOrder, getSortValue);

                sorted.forEach(stock => {
                    const data = getInvestorData(stock.investorData);
                    const { individual, foreign, institution, total, isPrev } = data;

                    const formatQty = (val) => {
                        if (val === 0) return '0';
                        const sign = val > 0 ? '+' : '';
                        if (Math.abs(val) >= 10000) {
                            return sign + (val / 10000).toFixed(1) + '만';
                        }
                        return sign + formatNumber(val);
                    };

                    const prevPrefix = isPrev ? '<span style="color: var(--text-secondary);">(전일)</span> ' : '';

                    html += `
                        <div class="stock-item" onclick="quickSearchInvestor('${stock.stock_code}', '${stock.stock_name}')">
                            <div class="stock-info">
                                <h3>${stock.stock_name}</h3>
                                <div class="code">${stock.stock_code}</div>
                            </div>
                            <div class="investor-summary">
                                <div class="total ${getChangeClass(total)}">${formatQty(total)}</div>
                                <div class="detail">
                                    ${prevPrefix}<span class="${getChangeClass(individual)}">개인 ${formatQty(individual)}</span>
                                    <span style="color: var(--text-secondary);">·</span>
                                    <span class="${getChangeClass(foreign)}">외인 ${formatQty(foreign)}</span>
                                    <span style="color: var(--text-secondary);">·</span>
                                    <span class="${getChangeClass(institution)}">기관 ${formatQty(institution)}</span>
                                </div>
                            </div>
                        </div>
                    `;
                });
            } else {
                html += '<div style="text-align: center; padding: 20px; color: var(--text-secondary);">보유 종목 없음</div>';
            }

            html += '</div>';
            container.innerHTML = html;

            // 정렬 칩 이벤트 바인딩
            document.querySelectorAll('.investor-sort-chips .sort-chip').forEach(chip => {
                chip.addEventListener('click', () => {
                    const type = chip.dataset.type;
                    if (investorSortType === type) {
                        // 같은 타입 클릭: 순환 (default -> high -> low -> default)
                        if (investorSortOrder === 'default') investorSortOrder = 'high';
                        else if (investorSortOrder === 'high') investorSortOrder = 'low';
                        else investorSortOrder = 'default';
                    } else {
                        // 다른 타입 클릭: 해당 타입으로 변경, 높은순 시작
                        investorSortType = type;
                        investorSortOrder = 'high';
                    }
                    if (cachedInvestorHoldings) {
                        renderInvestorHoldings(cachedInvestorHoldings, container);
                    }
                });
            });
        }

        // 시세 조회
        async function searchStock() {
            const input = document.getElementById('stock-code').value.trim();
            if (!input) return;

            const container = document.getElementById('price-search-result');
            container.innerHTML = '<div class="loading">조회 중</div>';

            // 한글이 포함되어 있으면 보유종목에서 검색
            const hasKorean = /[가-힣]/.test(input);
            let code = input;
            let stockName = '';
            let isOverseas = /^[A-Za-z]+$/.test(input);

            if (hasKorean) {
                // 국내 보유종목에서 검색
                let found = null;
                if (cachedDomesticBalance) {
                    found = cachedDomesticBalance.holdings.find(h =>
                        h.stock_name.includes(input) || input.includes(h.stock_name)
                    );
                }
                // 해외 보유종목에서도 검색
                if (!found && cachedOverseasBalance) {
                    found = cachedOverseasBalance.holdings.find(h =>
                        h.stock_name.includes(input) || input.includes(h.stock_name)
                    );
                    if (found) isOverseas = true;
                }

                if (found) {
                    code = found.stock_code;
                    stockName = found.stock_name;
                } else {
                    container.innerHTML = '<div class="error">보유 종목에서 찾을 수 없습니다. 종목코드로 검색하세요.</div>';
                    return;
                }
            }

            try {
                const res = await fetch('/call', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: 'get_stock_price',
                        arguments: {
                            stock_code: code.toUpperCase(),
                            market: isOverseas ? 'overseas' : 'domestic'
                        }
                    })
                });

                const data = await res.json();

                if (data.error) {
                    container.innerHTML = `<div class="error">${data.error}</div>`;
                    return;
                }

                // 종목명 설정
                if (stockName && (!data.stock_name || data.stock_name === data.stock_code)) {
                    data.stock_name = stockName;
                }

                renderPrice(data, isOverseas, container);
                updateTimestamp();
            } catch (e) {
                container.innerHTML = `<div class="error">조회 실패: ${e.message}</div>`;
            }
        }

        // 빠른 시세 조회 (보유종목 클릭 시)
        async function quickSearchStock(code, isOverseas, stockName = '') {
            document.getElementById('stock-code').value = code;

            const container = document.getElementById('price-search-result');
            container.innerHTML = '<div class="loading">조회 중</div>';

            // 스크롤 위로
            window.scrollTo({ top: 0, behavior: 'smooth' });

            const todayAllZero = data.individual === 0 && data.foreign === 0 && data.institution === 0;

            const usePrev = todayAllZero && hasPrevData;
            const individual = usePrev ? data.prev_individual : data.individual;
            const foreign = usePrev ? data.prev_foreign : data.foreign;
            const institution = usePrev ? data.prev_institution : data.institution;
            const total = individual + foreign + institution;
            const dateStr = usePrev ? data.prev_date : data.date;

        // 보유종목 RSI 병렬 조회
        async function fetchTechnicalRsiForHoldings(balanceData, isOverseas) {
            const holdings = balanceData.holdings || [];
            if (holdings.length === 0) return;

            const cacheKey = isOverseas ? 'overseas' : 'domestic';

            // 이미 캐시에 있는 종목은 제외
            const toFetch = holdings.filter(h => {
                const code = isOverseas ? h.symbol : h.stock_code;
                return !cachedTechnicalRsi[cacheKey][code];
            });

            if (toFetch.length === 0) return;

            // 병렬로 RSI 조회
            const promises = toFetch.map(async stock => {
                const code = isOverseas ? stock.symbol : stock.stock_code;
                const exchange = isOverseas ? (stock.exchange || 'NAS') : '';

                try {
                    const args = { stock_code: code };
                    if (isOverseas) {
                        args.market = 'overseas';
                        args.exchange = exchange;
                    }

                    const res = await fetch('/call', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            name: 'get_technical_indicators',
                            arguments: args
                        })
                    });

                    const data = await res.json();
                    if (!data.error && data.rsi_14 !== null && data.rsi_14 !== undefined) {
                        cachedTechnicalRsi[cacheKey][code] = data.rsi_14;
                    }
                } catch (e) {
                    console.error(`RSI fetch failed for ${code}:`, e);
                }
            });

            await Promise.all(promises);
        }

        function renderTechnicalHoldings(data, container, market = 'domestic') {
            const isOverseas = market === 'overseas';
            const cacheKey = isOverseas ? 'overseas' : 'domestic';

            // RSI 클래스 결정 (과매수: red, 과매도: green, 중립: 기본)
            const getRsiClass = (rsi) => {
                if (rsi === null || rsi === undefined) return '';
                if (rsi >= 70) return 'negative';  // 과매수
                if (rsi <= 30) return 'positive';  // 과매도
                return '';
            };

            // RSI 상태 텍스트
            const getRsiStatus = (rsi) => {
                if (rsi === null || rsi === undefined) return '-';
                if (rsi >= 70) return `${rsi.toFixed(0)} (과매수)`;
                if (rsi <= 30) return `${rsi.toFixed(0)} (과매도)`;
                return `${rsi.toFixed(0)}`;
            };

            // 정렬 토글 추가
            let html = createSortToggle('technical');
            html += '<div class="stock-list">';

            const holdings = data.holdings || [];
            if (holdings.length > 0) {
                // 각 종목에 RSI 값 추가
                const holdingsWithRsi = holdings.map(stock => {
                    const code = isOverseas ? stock.symbol : stock.stock_code;
                    const rsi = cachedTechnicalRsi[cacheKey][code] ?? null;
                    return { ...stock, rsi };
                });

                // 기본 정렬: 평가금액 높은 순, 그 외: RSI 기준
                let sorted = [...holdingsWithRsi].sort((a, b) => b.eval_amount - a.eval_amount);
                sorted = sortHoldings(sorted, currentSortOrder, h => h.rsi ?? 50);  // RSI 없으면 50으로 간주

                sorted.forEach(stock => {
                    const rsiClass = getRsiClass(stock.rsi);
                    const rsiDisplay = getRsiStatus(stock.rsi);
                    const stockCode = isOverseas ? stock.symbol : stock.stock_code;
                    const exchange = isOverseas ? (stock.exchange || 'NAS') : '';
                    html += `
                        <div class="stock-item" onclick="quickSearchTechnical('${stockCode}', '${stock.stock_name}', ${isOverseas}, '${exchange}')">
                            <div class="stock-info">
                                <h3>${stock.stock_name}</h3>
                                <div class="code">${stockCode}${isOverseas ? ' · ' + exchange : ''}</div>
                            </div>
                            <div class="stock-price">
                                <div class="current ${rsiClass}" style="font-size: 18px;">RSI ${rsiDisplay}</div>
                            </div>
                        </div>
                    `;
                });
            } else {
                html += '<div style="text-align: center; padding: 20px; color: var(--text-secondary);">보유 종목 없음</div>';
            }

            html += '</div>';
            container.innerHTML = html;

            // 정렬 이벤트 바인딩
            bindSortToggle('technical', () => renderTechnicalHoldings(data, container, market));
        }

        // 재무 탭 - 보유종목 로드
        async function loadFinancialHoldings() {
            const container = document.getElementById('financial-holdings-content');

            if (cachedDomesticBalance) {
                renderFinancialHoldings(cachedDomesticBalance, container);
                // 재무비율 데이터 병렬 조회
                await fetchFinancialRatiosForHoldings(cachedDomesticBalance.holdings || [], container);
                return;
            }

            container.innerHTML = '<div class="loading">로딩 중</div>';

            try {
                const res = await fetch('/call', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: 'get_domestic_balance', arguments: {} })
                });

                const data = await res.json();

                if (data.error) {
                    container.innerHTML = `<div class="error">${data.error}</div>`;
                    return;
                }

                cachedDomesticBalance = data;
                renderFinancialHoldings(data, container);
                // 재무비율 데이터 병렬 조회
                await fetchFinancialRatiosForHoldings(data.holdings || [], container);
            } catch (e) {
                container.innerHTML = `<div class="error">조회 실패: ${e.message}</div>`;
            }
        }

        // 보유종목의 재무비율 데이터 병렬 조회
        async function fetchFinancialRatiosForHoldings(holdings, container) {
            if (!holdings || holdings.length === 0) return;

            // 아직 캐시되지 않은 종목만 조회
            const uncachedHoldings = holdings.filter(h => !cachedFinancialRatios[h.stock_code]);

            if (uncachedHoldings.length === 0) {
                // 이미 모두 캐시됨 - 다시 렌더링
                renderFinancialHoldings(cachedDomesticBalance, container);
                return;
            }

            // 병렬로 재무비율 조회
            const promises = uncachedHoldings.map(h =>
                fetch('/call', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: 'get_financial_ratio',
                        arguments: { stock_code: h.stock_code, stock_name: h.stock_name }
                    })
                })
                .then(res => res.json())
                .then(data => {
                    if (!data.error) {
                        cachedFinancialRatios[h.stock_code] = data;
                    }
                })
                .catch(() => {})
            );

            await Promise.all(promises);
            // 재무비율 로드 완료 후 다시 렌더링
            renderFinancialHoldings(cachedDomesticBalance, container);
        }

        function renderFinancialHoldings(data, container) {
            // 정렬 칩 추가
            let html = createFinancialSortToggle();
            html += '<div class="stock-list">';

            const holdings = data.holdings || [];
            if (holdings.length > 0) {
                // 선택된 지표 기준 정렬
                const getValueFunc = (h) => {
                    const ratio = cachedFinancialRatios[h.stock_code];
                    if (!ratio) return 0;
                    return ratio[financialSortType] || 0;
                };

                let sorted;
                if (financialSortOrder === 'default') {
                    // 기본 정렬: 평가금액 높은 순
                    sorted = [...holdings].sort((a, b) => b.eval_amount - a.eval_amount);
                } else {
                    sorted = sortHoldings(holdings, financialSortOrder, getValueFunc);
                }

                sorted.forEach(stock => {
                    const ratio = cachedFinancialRatios[stock.stock_code];
                    const formatVal = (val) => val !== null && val !== undefined ? val.toFixed(1) : '-';

                    html += `
                        <div class="stock-item" onclick="quickSearchFinancial('${stock.stock_name}', '${stock.stock_code}')">
                            <div class="stock-info">
                                <h3>${stock.stock_name}</h3>
                                <div class="code">${stock.stock_code}</div>
                            </div>
                            <div class="financial-metrics">
                                <div class="metric">
                                    <span class="metric-label">ROE</span>
                                    <span class="metric-value ${ratio?.roe ? getChangeClass(ratio.roe) : ''}">${ratio ? formatVal(ratio.roe) : '-'}</span>
                                </div>
                                <div class="metric">
                                    <span class="metric-label">PER</span>
                                    <span class="metric-value">${ratio ? formatVal(ratio.per) : '-'}</span>
                                </div>
                                <div class="metric">
                                    <span class="metric-label">PBR</span>
                                    <span class="metric-value">${ratio ? formatVal(ratio.pbr) : '-'}</span>
                                </div>
                            </div>
                        </div>
                    `;
                });
            } else {
                html += '<div style="text-align: center; padding: 20px; color: var(--text-secondary);">보유 종목 없음</div>';
            }

            html += '</div>';
            container.innerHTML = html;

            // 정렬 칩 이벤트 바인딩
            bindFinancialSortChips(data, container);
        }

        // 재무탭 정렬 칩 이벤트 바인딩
        function bindFinancialSortChips(data, container) {
            const chipsContainer = document.getElementById('financial-sort-chips');
            if (chipsContainer) {
                chipsContainer.addEventListener('click', (e) => {
                    const chip = e.target.closest('.sort-chip');
                    if (chip) {
                        const type = chip.dataset.type;
                        if (financialSortType === type) {
                            // 같은 타입 클릭: 정렬 순서 순환
                            if (financialSortOrder === 'default') financialSortOrder = 'high';
                            else if (financialSortOrder === 'high') financialSortOrder = 'low';
                            else financialSortOrder = 'default';
                        } else {
                            // 다른 타입 클릭: 해당 타입으로 변경, 높은순으로 시작
                            financialSortType = type;
                            financialSortOrder = 'high';
                        }
                        renderFinancialHoldings(data, container);
                    }
                });
            }
        }
